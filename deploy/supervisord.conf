[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

# ═══════════════════════════════════════════════════════════════════════════════
# IMPORTANT: supervisord's environment= key REPLACES the child process env,
# it does NOT inherit the parent env automatically.
# Therefore every variable the app needs must be listed explicitly here.
#
# Railway injects Redis as one of several possible variable names; we forward
# all of them so that app/config.py (_resolve_redis_url) can find whichever
# one is actually set.  Missing variables default to empty string "".
# ═══════════════════════════════════════════════════════════════════════════════

# Shared macro — all Redis env vars + common settings forwarded to every process.
# supervisord does not support real macros, so we repeat the block for each
# program.  Keep them in sync if you add new variables.

# ── API (FastAPI + uvicorn) ───────────────────────────────────────────────────
[program:api]
command=python3 -u -m uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    PORT="%(ENV_PORT)s",
    REDIS_URL="%(ENV_REDIS_URL)s",
    REDIS_PRIVATE_URL="%(ENV_REDIS_PRIVATE_URL)s",
    REDIS_PUBLIC_URL="%(ENV_REDIS_PUBLIC_URL)s",
    REDISURL="%(ENV_REDISURL)s",
    REDIS_TLS_URL="%(ENV_REDIS_TLS_URL)s",
    ADMIN_TOKEN="%(ENV_ADMIN_TOKEN)s"
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=5MB
redirect_stderr=false

# ── Worker-1 ──────────────────────────────────────────────────────────────────
[program:worker-1]
command=python3 -u worker/worker.py
directory=/app
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    STREAM_CONSUMER="worker-1",
    REDIS_URL="%(ENV_REDIS_URL)s",
    REDIS_PRIVATE_URL="%(ENV_REDIS_PRIVATE_URL)s",
    REDIS_PUBLIC_URL="%(ENV_REDIS_PUBLIC_URL)s",
    REDISURL="%(ENV_REDISURL)s",
    REDIS_TLS_URL="%(ENV_REDIS_TLS_URL)s",
    ADMIN_TOKEN="%(ENV_ADMIN_TOKEN)s"
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/var/log/supervisor/worker-1.log
stderr_logfile=/var/log/supervisor/worker-1-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=5MB

# ── Worker-2 ──────────────────────────────────────────────────────────────────
[program:worker-2]
command=python3 -u worker/worker.py
directory=/app
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    STREAM_CONSUMER="worker-2",
    REDIS_URL="%(ENV_REDIS_URL)s",
    REDIS_PRIVATE_URL="%(ENV_REDIS_PRIVATE_URL)s",
    REDIS_PUBLIC_URL="%(ENV_REDIS_PUBLIC_URL)s",
    REDISURL="%(ENV_REDISURL)s",
    REDIS_TLS_URL="%(ENV_REDIS_TLS_URL)s",
    ADMIN_TOKEN="%(ENV_ADMIN_TOKEN)s"
autostart=true
autorestart=true
startretries=5
startsecs=2
stdout_logfile=/var/log/supervisor/worker-2.log
stderr_logfile=/var/log/supervisor/worker-2-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=5MB

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
